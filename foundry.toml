[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.33"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 300  # v0.17.1 runtime-gas floor; size kept under EIP-170 via code-level slimming, not by starving the optimizer
bytecode_hash = "none" # drop the trailing IPFS metadata hash (small but free EIP-170 headroom)

remappings = [
    "@account-abstraction/=lib/account-abstraction/contracts/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]
