[profile.default]
auto_detect_remappings = false
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Always emit storageLayout so `forge inspect <C> storage-layout` (used by the account≡Extension
# storage-parity CI gate, scripts/check-storage-parity.mjs) reads it straight from the artifact and
# never hits the "storage layout missing from artifact" caching quirk after a partial/prior build.
extra_output = ["storageLayout"]

solc_version = "0.8.33"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200  # EIP-170 headroom lever (#170): measured 300→200 = +190 B runtime headroom for ~+0.03% hot-path gas (validateUserOp/execute/executeBatch move ±0.0-0.3%, several DECREASE). The old "300 gas-floor" note was overstated for these paths; 200 is the deliberate size/gas trade.
bytecode_hash = "none" # drop the trailing IPFS metadata hash (small but free EIP-170 headroom)

remappings = [
    "@account-abstraction/=lib/account-abstraction/contracts/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
    "account-abstraction/=lib/account-abstraction/contracts/",
]
