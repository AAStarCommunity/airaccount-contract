# Durable health check for the committee validator the CURRENT stack mounts.
#
# WHY A WORKFLOW AND NOT A SESSION MONITOR: the failure this guards against (validator armed but
# requiredQuorum() == sentinel => tier-2/3 silently fail-closed) went unseen for ~10 hours upstream
# precisely because nothing durable was watching. An ad-hoc monitor in someone's terminal dies with
# the terminal; this does not.
#
# ANTI-STALENESS: the validator address is derived from the router at algId 0x01 every run, so
# swapping validators can never leave this green-forever against a retired address (the upstream
# #252 failure mode). Pin AIRACCOUNT_ROUTER via a repo variable when the stack moves.
name: Committee health

on:
  schedule:
    # ⚠️ THIS TRIGGER HAS NEVER BEEN OBSERVED TO FIRE. Do not treat this workflow as durable
    # monitoring on the strength of the cron line alone.
    #
    # The earlier claim here — "offset minutes fired normally" — was FALSE. It was second-hand and I
    # never measured it; it has since been falsified. Measurements, all with schedule events = 0:
    #   "*/15"           0 fires / 53 min  /  4 slots   (upstream repo)
    #   "7,22,37,52"     0 fires / 6h33m   / 26 slots   (dvt repo, same cron as here)
    #   "7,22,37,52"     0 fires / 83 min  /  5 slots   (this repo, and counting)
    # Offsetting is NOT a fix; the failure is not specific to */N.
    #
    # Ruled out, so this is the trigger and not the config: the YAML parses with a valid
    # on.schedule.cron, the workflow is state=active via the API, the repo is neither archived nor
    # disabled and has recent pushes (so it is not the 60-day inactivity auto-disable), and
    # workflow_dispatch on this very workflow runs green — the job works, the trigger never arrives.
    #
    # Kept because it costs nothing if GitHub's scheduler recovers, and dispatch remains the only
    # PROVEN trigger. Until a schedule event is actually observed, treat durable coverage as an
    # ACCEPTED GAP, not as delivered. The header's own line — "a scheduled check that does not fire
    # is indistinguishable from not having one" — currently points at this file.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      at_block:
        description: "Replay the verdict as of a historical block (needs an archive RPC; the public fallback cannot serve historical state)"
        required: false
      keeper_latency_blocks:
        description: "Override K (default 20 blocks ~ 4 min)"
        required: false

permissions:
  contents: read

# Dedup is a read-then-write (list open issues -> create if none), which is NOT atomic: two alert jobs
# overlapping would both see "none open" and both file an issue — reintroducing the notification spam
# the single-issue design exists to prevent.
#
# Window size, measured (NOT the earlier "72s" figure, which was wrong — 72s was the margin by which
# drill 2 MISSED the window, not the window itself). From drill 1's alert step log:
#   step start 09:00:18.578  ->  "opened ...#216" 09:00:23.075   = ~4.5s of list->create exposure
# So the race is real but narrow; it was never close to being demonstrated. Cheap to remove anyway.
#
# The group includes github.event_name. This is a TRADE, not a pure win — both options give something up:
#   constant group : nothing can race, but a manual drill EVICTS a queued scheduled run. The evicted run
#                    vanishes with no trace => a silent hole in monitoring, exactly while someone pokes.
#   per-event group: no cross-event eviction, but a dispatch and a scheduled run CAN now overlap, which
#                    is precisely the condition the ~4.5s list->create race needs. Worst case: both file
#                    an issue => one duplicate. And "poke it while the schedule runs" is a COMMON action,
#                    so this hole is reachable, not theoretical.
# Chosen because a duplicate issue is visible and closable in seconds, whereas a silently dropped
# monitoring run leaves no evidence it was ever supposed to happen. Having BOTH requires making the
# dedup itself atomic (create, re-query, close your own duplicate) — deliberately out of scope here.
concurrency:
  group: committee-health-alert-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    name: committee validator health
    runs-on: ubuntu-latest
    timeout-minutes: 10   # a hung RPC must not ride the 6h runner cap
    outputs:
      # 1 = CRITICAL (determinate), 2 = UNDETERMINED (could not look). The alert job words the issue
      # differently per code — claiming "tier-2/3 is fail-closed" when we merely failed to read is a
      # false statement, and the RPC falls back to a public endpoint, so blips reach here routinely.
      code: ${{ steps.run.outputs.code }}
      verdict: ${{ steps.run.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check committee validator
        id: run
        env:
          # Falls back to a public endpoint so this works with no repo secrets configured.
          # Add a SEPOLIA_RPC_URL secret for a dedicated (and archive-capable) endpoint.
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          # Router of the CURRENT stack (v0.33.0). Update this variable when the stack moves —
          # the validator itself is derived from it, so only this one value tracks the deploy.
          # Pass the variable THROUGH, empty if unset -- do NOT fill the default in here. Doing so
          # handed the script an AIRACCOUNT_ROUTER that looked chosen by a human when nobody had
          # chosen it, so the run announced "(from AIRACCOUNT_ROUTER)" in the one context where it
          # matters. The script owns the default and can therefore say which happened.
          AIRACCOUNT_ROUTER: ${{ vars.AIRACCOUNT_ROUTER }}
          EXPECTED_COMMITTEE: ${{ vars.EXPECTED_COMMITTEE }}
          # NOTE: on the schedule path these `inputs.*` expand to the EMPTY STRING, not null. The
          # script must therefore treat "" as unset (it uses `||`, not `??` — BigInt("") === 0n would
          # silently set K=0 and turn every normal keeper window into a false CRITICAL).
          KEEPER_LATENCY_BLOCKS: ${{ inputs.keeper_latency_blocks }}
          AT_BLOCK: ${{ inputs.at_block }}
        run: |
          set +e
          # tee, because the verdict is parsed out of the output below. Grepping a file nothing wrote
          # fails SILENTLY (empty verdict -> UNKNOWN -> recover skipped forever) and YAML lint stays
          # green -- caught only by drilling the job.
          node scripts/committee-health.mjs 2>&1 | tee out.txt
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Exit 0 covers BOTH OK and WARN, and WARN "committee is OFF" means tier-2/3 is still
          # unavailable -- so the code alone must never decide that an incident is resolved.
          verdict="$(grep -o '^verdict=.*' out.txt | tail -1 | cut -d= -f2)"
          echo "verdict=${verdict:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          exit $code

  alert:
    name: open/update alert issue
    needs: check
    # `always() && result != 'success'` — NOT `failure()`. A timeout CANCELS the job, and `failure()`
    # does not match a cancelled result, so a hung check would alert nobody.
    if: always() && needs.check.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open the alert issue (once per incident, per category)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.check.result }}
          CODE: ${{ needs.check.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_ASSIGNEE: ${{ vars.ALERT_ASSIGNEE }}
        run: |
          set -euo pipefail
          LABEL="committee-health"
          # Exit 1 = determinate badness. Exit 2 = we could not look. Empty = job cancelled/timed out,
          # which is also "we could not look". Wording MUST differ: asserting "tier-2/3 is fail-closed"
          # when the RPC merely blipped is a false claim, and the public-RPC fallback makes that common.
          case "${CODE:-}" in
            1) KIND="critical"
               TITLE="Committee validator health: CRITICAL"
               WHAT="\`requiredQuorum()\` is the sentinel outside the structural keeper window — **tier-2/3 is fail-closed on this stack** (tier-1 owner-only still works)." ;;
            2) KIND="undetermined"
               TITLE="Committee validator health: UNDETERMINED (could not complete)"
               WHAT="The check could not complete (RPC/transport). **This asserts nothing about stack health** — it may be perfectly fine. The RPC falls back to a public endpoint, so rate-limits and blips land here." ;;
            *) KIND="undetermined"
               TITLE="Committee validator health: UNDETERMINED (job ${RESULT})"
               WHAT="The check job did not finish (result: \`${RESULT}\`; a timeout surfaces as *cancelled*). **This asserts nothing about stack health.**" ;;
          esac
          # Marker is PER CATEGORY: with one shared marker an open UNDETERMINED issue would suppress a
          # later real CRITICAL — one class masking another, the same failure this split exists to fix.
          MARKER="<!-- committee-health-alert-v1:${KIND} -->"
          gh label create "$LABEL" --repo "$REPO" --color B60205 \
            --description "Automated committee validator health alerts" 2>/dev/null || true
          # DEPENDENCY: this needs external `jq` (GitHub-hosted runners ship it). On a runner without
          # it, `set -o pipefail` surfaces the failure as a FAILED ALERT JOB — i.e. as 'no alert',
          # not as 'jq is missing'. If this ever moves to self-hosted, assert `command -v jq` first.
          # NOTE: pipe to REAL jq. `gh ... --jq` takes a single expression and does NOT accept `--arg`
          # (that is a jq CLI flag); passing it makes gh treat the marker and the program as stray
          # positional args and exit 1. Verified locally with `echo JSON | jq --arg`, which is a
          # DIFFERENT engine than gh's built-in — the drill is what caught it.
          EXISTING="$(gh issue list --repo "$REPO" --label "$LABEL" --state open --limit 100 \
            --json number,body \
            | jq -r --arg m "$MARKER" '[.[] | select(.body // "" | contains($m))] | .[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            # Silent while an alert of THIS category is open: at 4 runs/hour, commenting would post ~96
            # notifications/day for one incident — the alert fatigue K exists to prevent on the WARN side.
            echo "a ${KIND} alert is already open as #$EXISTING — staying silent (see $RUN_URL)"
            exit 0
          fi
          BODY="$MARKER
          ${WHAT}

          Job result: \`${RESULT}\`, script exit code: \`${CODE:-none}\`
          Run: ${RUN_URL}

          Detail is in the \`committee validator health\` job log (it prints each \`_epochUsable\`
          conjunct, so a config bump or expired set is distinguishable from an unpinned epoch).

          Opened once per incident per category; NOT re-commented every run. A healthy run closes this
          automatically, so an open issue means the failure is CURRENT — the next failure of this
          category opens a fresh one."
          URL="$(gh issue create --repo "$REPO" --title "$TITLE" --label "$LABEL" --body "$BODY")"
          echo "opened $URL"
          # Assign AFTER creating: `create --assignee` resolves the login first, so a typo would fail the
          # whole command under set -e and leave NO issue. Missing assignee costs one notification.
          if [ -n "${ALERT_ASSIGNEE:-}" ]; then
            gh issue edit "${URL##*/}" --repo "$REPO" --add-assignee "$ALERT_ASSIGNEE" || \
              echo "warning: could not assign '$ALERT_ASSIGNEE' (issue is still open)"
          fi

  # The other half of dedup. Dedup guarantees one issue per incident per category -- which means an
  # open issue stops meaning "there is a problem NOW" and starts meaning "there was one once". A stale
  # open alert trains people to ignore open alerts: the same alert fatigue dedup exists to prevent,
  # arriving from the other end. So a healthy run closes what it fixed, and the open set stays equal
  # to the current failure set.
  recover:
    name: close resolved alerts
    needs: check
    # OK only -- NOT exit code 0, which also covers WARN. One WARN ("committee is OFF") means
    # CC-116 is fail-closing tier-2/3: safe, but still unavailable. Closing a CRITICAL because
    # someone disarmed the committee to stop the bleeding would report the incident resolved while
    # tier-2/3 stayed down -- this invariant broken in the worst direction. Whether the structural
    # keeper-latency WARN should also clear needs a reason code, which is a redesign, not this PR.
    if: needs.check.outputs.verdict == 'OK'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The comment must be GENERATED FROM the fact it asserts, not written in parallel with it.
          # Hardcoding "reported OK" made the sentence's truth depend on the `if` ten lines above
          # rather than on itself, so changing the gate would silently turn it into a lie -- and the
          # gate-mutation drill produced exactly that: a "reported OK" comment on a WARN run.
          VERDICT: ${{ needs.check.outputs.verdict }}
        run: |
          set -euo pipefail
          LABEL="committee-health"
          # Close on the MARKER, never on the label alone. There is deliberately no author filter (that
          # would make two monitors invisible to each other and each open their own issue), so the
          # marker is the only thing separating "a monitor opened this" from "a person opened this" --
          # and closing someone's hand-filed issue because it shares a label is a worse bug than the
          # stale alert this fixes. Convention shared with the dvt repo so both monitors agree.
          for KIND in critical undetermined; do
            MARKER="<!-- committee-health-alert-v1:${KIND} -->"
            # Pipe to REAL jq: `gh --jq` is a different engine and does not accept `--arg`.
            NUMS="$(gh issue list --repo "$REPO" --label "$LABEL" --state open --limit 100 \
              --json number,body \
              | jq -r --arg m "$MARKER" '.[] | select(.body // "" | contains($m)) | .number')"
            for N in $NUMS; do
              gh issue comment "$N" --repo "$REPO" --body \
                "Resolved: the check reported ${VERDICT:-unknown} at $(date -u +%Y-%m-%dT%H:%M:%SZ). ${RUN_URL}
          Closed automatically so the open set equals the current failure set. A new failure of this
          category opens a fresh issue rather than reviving this one.
          NOTE: these lines sit at the block scalar base indent (10), not at column 0 and not deeper.
          Column 0 ends the scalar; 4+ spaces past base make Markdown render the body as a code block."
              gh issue close "$N" --repo "$REPO" --reason completed
              echo "closed #$N (${KIND})"
            done
          done
