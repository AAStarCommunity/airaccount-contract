name: Foundry Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run tests
        run: forge test --summary
        working-directory: .

      - name: Verify merged full ABI is up to date (diamond-lite fallback surface)
        # `forge test` above already produces all artifacts in `out/`; the prior
        # `forge build` was a redundant cold rebuild (~15 min on via_ir +
        # optimizer_runs=300), which kept hanging the runner. Removed 2026-06-02
        # — build-full-abi.mjs reads from the artifacts forge test wrote.
        run: node scripts/build-full-abi.mjs --check
        working-directory: .

      # ── ABI documentation drift gate (v0.17.2-beta.4) ──────────────────────
      # gen-abi-docs.mjs regenerates docs/abi/{reference,selectors}.md from the
      # out/ artifacts forge test wrote. It uses viem (keccak for event/error
      # topics), so it needs node deps installed — unlike build-full-abi.mjs above.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify ABI docs are up to date (pnpm gen:abi-docs:check)
        run: pnpm gen:abi-docs:check
        working-directory: .

  # ── issue #45 BLS↔userOpHash binding (EIP-2537 / Prague) ───────────────────
  # The main `test` job runs under the repo-default evm_version = cancun, where the
  # EIP-2537 precompiles (0x05 MODEXP is fine, but 0x0d/0x11 for G2ADD/MAP_FP2_TO_G2)
  # do NOT exist — so the on-chain hash_to_curve / pairing tests self-skip there.
  # This job re-runs ONLY the #45 binding tests under --evm-version prague, where revm
  # provides EIP-2537, so the golden-vector + replay-binding crypto is actually exercised.
  #
  # Scoped with --match-contract on purpose: there are 2 PRE-EXISTING, #45-UNRELATED
  # failures under prague that this job intentionally excludes (tracked separately):
  #   • AAStarBLSAlgorithmTest.test_aggregateKeys_twoNodes — feeds non-curve fake G1
  #     points; the real G1ADD (0x0b) precompile rejects them (under cancun the empty
  #     account silently "succeeds").
  #   • AAStarBLSAlgorithmTest.test_g2Add — exercises the legacy g2Add helper at 0x0e,
  #     which is BLS12_G2MSM (not G2ADD) in the final EIP-2537 addressing.
  # Neither is touched by #45; do not widen this job's scope until they are fixed.
  bls-binding-prague:
    name: forge test (EIP-2537 / prague) — #45 binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run #45 binding tests under Prague (golden-vector + single-op replay + batch aggregator)
        run: forge test --evm-version prague --match-contract "HashToG2GoldenTest|BLSReplayBindingTest|AAStarBLSAggregatorTest" -vv
        working-directory: .
