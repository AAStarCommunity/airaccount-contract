name: Foundry Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: false

      - name: Initialize build submodules
        run: git submodule update --init lib/account-abstraction lib/openzeppelin-contracts lib/forge-std

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to 1.7.1 (was `stable`). foundry `stable` rolled to 1.8.1 on 2026-08-28.
          #
          # ROOT CAUSE (corrected — see PR #209 review). foundry 1.8.x runs each top-level call from a
          # test as its OWN transaction, so EIP-1153 transient storage is cleared BETWEEN top-level
          # calls. This account carries the validated algId and the session-key tag from
          # validateUserOp into execute() through content-keyed transient slots
          # (AAStarAirAccountBase.sol:1720-1762). Under 1.8.x the two `vm.prank`ed calls in those
          # tests no longer share transient state, so algId reads back as 0 -> _algTier(0) == 0 ->
          # InsufficientTier(required, 0), and the session-key scope tag is lost.
          #
          # It is NOT a revm tier-resolution change and NOT about P256/BLS: both validate normally in
          # the trace. Minimal repro with no contract of ours involved — a 2-function contract doing
          # `tstore(7, v)` / `tload(7)`, called twice at top level inside ONE test function, returns
          # 42 on 1.7.1 and 0 on 1.8.1 (gas 6,654 -> 30,928, i.e. +~21000 intrinsic per call).
          # solc stays 0.8.33, so bytecode is unchanged either way.
          #
          # Un-pinning therefore needs the affected tests restructured to run validation and execution
          # in ONE transaction (via handleOps), not a contract fix. 1.7.1 is the last version main was
          # green on (CI run 2026-08-18).
          #
          # The same split also happens ON 1.7.1 whenever `--gas-report` is passed -- which is how this
          # first surfaced (CC-94, reported as "six tier tests fail under --gas-report"). Run
          # test/TransientAcrossTopLevelCalls.t.sol with and without that flag to see it directly: the
          # probe prints 99 and then 0, with no contract of ours involved.
          version: "1.7.1"

      - name: Run tests
        run: forge test --summary
        working-directory: .

      - name: Verify merged full ABI is up to date (diamond-lite fallback surface)
        # `forge test` above already produces all artifacts in `out/`; the prior
        # `forge build` was a redundant cold rebuild (~15 min on via_ir +
        # optimizer_runs=300), which kept hanging the runner. Removed 2026-06-02
        # — build-full-abi.mjs reads from the artifacts forge test wrote.
        run: node scripts/build-full-abi.mjs --check
        working-directory: .

      # ── Diamond-lite storage-boundary gate (security hardening) ────────────
      # AAStarAirAccountV7 (account) and AirAccountExtension (fallback-routed facet)
      # share storage via delegatecall, so they MUST agree on every slot. This was
      # convention-only; the check makes it machine-enforced so a future state-var
      # added to either side (instead of AAStarAgentStorageLayout) fails the build
      # instead of silently corrupting storage across the boundary.
      - name: Verify account ≡ Extension storage-layout parity
        run: node scripts/check-storage-parity.mjs
        working-directory: .

      # ── ABI documentation drift gate (v0.17.2-beta.4) ──────────────────────
      # gen-abi-docs.mjs regenerates docs/abi/{reference,selectors}.md from the
      # out/ artifacts forge test wrote. It uses viem (keccak for event/error
      # topics), so it needs node deps installed — unlike build-full-abi.mjs above.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify ABI docs are up to date (pnpm gen:abi-docs:check)
        run: pnpm gen:abi-docs:check
        working-directory: .

  # ── issue #45 BLS↔userOpHash binding (EIP-2537 / Prague) ───────────────────
  # The main `test` job runs under the repo-default evm_version = cancun, where the
  # EIP-2537 precompiles (G2ADD 0x0d / MAP_FP2_TO_G2 0x11) do NOT exist — so the
  # on-chain hash_to_curve / pairing tests self-skip there. This job re-runs the FULL
  # suite under --evm-version prague, where revm provides EIP-2537, so the golden-vector
  # + replay-binding + batch-aggregator crypto is actually exercised.
  #
  # #104 (v0.18.0-beta.2): the two pre-existing prague-only failures have been fixed
  # (dead 0x0e g2Add helper removed; test_aggregateKeys_twoNodes now feeds real on-curve
  # G1 points), so the job is no longer scoped with --match-contract — the whole suite
  # must be green under prague.
  bls-binding-prague:
    name: forge test (EIP-2537 / prague) — full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: false

      - name: Initialize build submodules
        run: git submodule update --init lib/account-abstraction lib/openzeppelin-contracts lib/forge-std

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to 1.7.1 — see the note on the `test` job above (foundry 1.8.x clears EIP-1153
          # transient storage between top-level calls in a test).
          version: "1.7.1"

      - name: Run full suite under Prague (golden-vector + single-op replay + batch aggregator + all units)
        run: forge test --evm-version prague -vv
        working-directory: .
